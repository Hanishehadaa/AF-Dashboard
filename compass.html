<title>Opportunity Compass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,650;8..144,800&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: a scoring sheet. Opportunity list on the left, the checklist in the middle, a sticky score ledger on top. Light only, by request. */
:root{
  color-scheme:light;
  --bg:#f5f6f8; --surface:#ffffff; --ink:#16181d; --muted:#5a606c; --line:#e0e3e9; --soft:#f0f2f5;
  --red:#D32737; --red-ink:#a81d2b; --red-tint:#fbe9eb;
  --good:#1b7046; --good-tint:#e3f2ea; --warn:#8f5600; --warn-tint:#fbf0dc; --crit:#b42318; --crit-tint:#fdeceb; --grey-tint:#eceef2;
  --f-ui:"Roboto Flex",Roboto,Arial,sans-serif; --f-num:"Roboto Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
h1{font-weight:800;font-size:clamp(26px,5vw,36px);letter-spacing:-.02em;margin:0;line-height:1.1}
h1 span{color:var(--red)}
.asof{font-size:13px;color:var(--muted)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--red)}
nav a:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.view{display:grid;gap:20px}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}.opps{max-height:280px;overflow:auto}}
.opps{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;gap:2px;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
@media (max-width:860px){.opps{position:static}}
.opp{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.opp:hover{background:var(--soft)}
.opp[aria-current="true"]{background:var(--red-tint)}
.opp:focus-visible{outline:2px solid var(--red)}
.opp .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opp .sc{font-family:var(--f-num);font-size:13px;font-variant-numeric:tabular-nums}
.opps .empty{padding:10px;font-size:13px;color:var(--muted)}
.opps .tools{display:flex;gap:6px;padding:8px 4px 4px;border-top:1px solid var(--line);margin-top:4px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.sheet{display:grid;gap:16px;min-width:0}
.scorebar{position:sticky;top:max(12px,env(safe-area-inset-top,0px));z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;box-shadow:0 6px 18px -12px rgba(22,24,29,.25)}
.big{font-family:var(--f-num);font-size:44px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:16px;color:var(--muted)}
.meta{display:grid;gap:8px;min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:12px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.p-pursue{background:var(--good-tint);color:var(--good)} .p-shape{background:var(--warn-tint);color:var(--warn)} .p-watch{background:var(--grey-tint);color:var(--muted)} .p-decline,.p-stop{background:var(--crit-tint);color:var(--crit)} .p-prov{background:var(--soft);color:var(--muted)}
.blocks{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media (max-width:620px){.blocks{grid-template-columns:repeat(4,minmax(0,1fr))}}
.blk{font-size:11px;color:var(--muted);display:grid;gap:3px}
.blk b{font-family:var(--f-num);font-weight:500;font-size:13px;color:var(--ink)}
.blk i{display:block;height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.blk i span{display:block;height:100%;background:var(--red)}
.blk.neg i span{background:var(--crit)}
.complete{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px}
.card h2{margin:0;font-size:17px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.card h2 .of{font-family:var(--f-num);font-weight:500;font-size:14px;color:var(--muted);white-space:nowrap}
.card h2 .of b{color:var(--ink);font-weight:500}
.card.export{border-color:var(--ink)}
.lead{margin:0;color:var(--muted);font-size:14px;max-width:72ch}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid #cdd2da;border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.q{border:0;border-top:1px solid var(--line);padding:12px 0 0;margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:start}
.q:first-of-type{border-top:0;padding-top:0}
.q legend{float:left;width:100%;padding:0;font-weight:500;font-size:14px}
.q .def{grid-column:1;margin:0;font-size:13px;color:var(--muted)}
.q .ctl{grid-column:2;grid-row:1 / span 2;display:flex;gap:8px;align-items:center}
@media (max-width:620px){.q{grid-template-columns:minmax(0,1fr)}.q .ctl{grid-column:1;grid-row:auto}}
.seg{display:inline-flex;border:1px solid #cdd2da;border-radius:8px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:6px 11px;font-size:13px;cursor:pointer;border-left:1px solid #cdd2da;white-space:nowrap;color:var(--muted)}
.seg label:first-of-type{border-left:0}
.seg input:checked+label{background:var(--ink);color:#fff}
.seg input:focus-visible+label{outline:2px solid var(--red);outline-offset:-2px}
.pts{font-family:var(--f-num);font-size:13px;min-width:5.5ch;text-align:right;font-variant-numeric:tabular-nums}
.pts.none{color:#9aa0ab}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:start;border-top:1px solid var(--line);padding-top:12px}
.ev:first-of-type{border-top:0;padding-top:0}
.ev input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--red)}
.ev .txt{display:grid;gap:2px;font-size:14px}
.ev .txt small{color:var(--muted);font-size:13px}
.ev .src{grid-column:2 / span 2;display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px}
@media (max-width:620px){.ev .src{grid-template-columns:minmax(0,1fr)}}
.warn{font-size:12px;color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.calc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;border-top:1px solid var(--line);padding-top:12px;font-size:14px}
.calc .how{color:var(--muted);font-size:13px;grid-column:1}
.calc .pts{grid-column:2;grid-row:1 / span 2}
.tierbox{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14px;display:grid;gap:4px}
.tierbox b{font-weight:650}
.tierbox a{color:var(--red-ink)}
.note{font-size:13px;color:var(--muted);margin:0;max-width:75ch}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--soft)}
td.n{font-family:var(--f-num);text-align:right;white-space:nowrap}
tr.sub td{background:#fafbfc;font-weight:650}
td a{color:var(--red-ink)}
.tag{display:inline-block;font-size:11px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);margin-right:6px}
.tag.qe{background:#e6eef8;color:#1d4f86}
.formula{font-family:var(--f-num);font-size:13px;background:var(--soft);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:nowrap}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;max-width:78ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;z-index:20}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:grid;gap:14px}
.welcome h2{margin:0;font-size:22px;letter-spacing:-.01em}
.newform{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:end}

.blocks{grid-template-columns:repeat(9,minmax(0,1fr))}
@media (max-width:720px){.blocks{grid-template-columns:repeat(5,minmax(0,1fr))}}
.rat{gap:10px}
.verdict{margin:0;font-size:16px;font-weight:500;line-height:1.45;max-width:75ch}
.ratcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.ratcols h3{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.ratcols h3.ok{color:var(--good)} .ratcols h3.wn{color:var(--warn)}
.ratcols ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:14px}
.gain{font-family:var(--f-num);font-size:12px;color:var(--warn);background:var(--warn-tint);padding:1px 6px;border-radius:999px;white-space:nowrap}
.chk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.chk input{accent-color:var(--red)}
.ev .src.one{grid-template-columns:minmax(0,1fr)}
.seg label{padding:6px 10px}
input:disabled{background:var(--soft);color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.blk i span{transition:width .25s}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Opportunity <span>Compass</span></h1>
      <div class="asof">Country guide reviewed 1 November 2026 · Review every quarter</div>
    </div>
  </header>
  <nav aria-label="Views">
    <a href="#score" data-view="score">Score an opportunity</a>
    <a href="#method" data-view="method">How the score works</a>
    <a href="#countries" data-view="countries">Country priority guide</a>
  </nav>

  <section class="view" id="v-score">
    <div class="layout">
      <aside class="opps" aria-label="Opportunities">
        <div id="opplist"></div>
        <div class="tools">
          <button class="btn primary" type="button" id="add">Add opportunity</button>
        </div>
      </aside>
      <div class="sheet" id="sheet"></div>
    </div>
  </section>

  <section class="view" id="v-method" hidden></section>
  <section class="view" id="v-countries" hidden></section>
</div>

const BLOCKS=[

  {id:'F',name:'Delivery',max:10,items:[

    {id:'f2',k:'check',pts:3,t:'Enrolment speed',y:'Students enrol within one academic year of signing',p:'Within two academic years'},

  {id:'k2',pts:3,note:true,t:'Link to HE Sheikha Al Mayassa bint Hamad’s initiatives',d:'Qatar Museums, the creative sector or a related programme'},
  {id:'k3',pts:3,note:true,t:'A new edge for Al Fakhoora',d:'A field we have not funded before, such as the creative economy, digital and AI, or green skills'},

const BONUS_CAP=10;
const RISKS=[
  {id:'r1',pts:6,t:'Access to the delivery site is blocked today',d:'Crossings closed, visas refused, campus unreachable'},
  {id:'r2',pts:5,t:'This partner had an EAA project suspended or terminated',d:'Any time in the past'},

  {id:'r4',pts:3,t:'Funding depends on one donor decision not yet made',d:'No written commitment yet'},

];
const RISK_CAP=15;
const MODALITIES=['TVET diploma or certificate','Bachelor’s (BA or BSc)','Mix of bachelor’s and TVET','Bachelor’s in the region','Bachelor’s in Qatar','Bachelor’s abroad','Master’s abroad','Online or hybrid degree'];
/* Bands: [threshold, points]. UP = at or above; DOWN = at or below. */
const BAND={
  share:{dir:'up',b:[[80,12],[65,10],[50,8],[40,5],[30,3],[15,2],[0.01,1]],txt:'Partner share = funding from others ÷ (EAA + others). 80% or more: 12 · 65%: 10 · 50%: 8 · 40%: 5 · 30%: 3 · 15%: 2 · above 0: 1 · none: 0. Points climb fastest past 50%.'},
  cost:{dir:'down',b:[[0.5,6],[0.75,5],[1.0,4],[1.25,2],[1.5,1]],txt:'EAA contribution ÷ (students × completion rate), against the benchmark for the modality. At or below 50% of benchmark: 6 · 75%: 5 · 100%: 4 · 125%: 2 · 150%: 1 · above: 0. With completion N/A, it uses cost per student.'},
  stu:{dir:'up',b:[[1000,4],[500,3],[200,2],[50,1]],txt:'1,000 or more: 4 · 500: 3 · 200: 2 · 50: 1 · fewer: 0'},
  comp:{dir:'up',b:[[90,3],[80,2],[70,1]],txt:'Partner’s last cohort. 90% or more: 3 · 80%: 2 · 70%: 1 · lower: 0. N/A for a partner with no past cohort.'},
  emp:{dir:'up',b:[[80,6],[70,5],[60,4],[50,3],[40,2],[25,1]],txt:'Share of the partner’s past graduates employed or self-employed within 12 months. 80% or more: 6 · 70%: 5 · 60%: 4 · 50%: 3 · 40%: 2 · 25%: 1 · lower: 0. N/A with no past cohorts.'}
};

/* ---------- State ---------- */
const KEY='af-compass-v4';
const blankNum=()=>({eaa:'',other:'',students:'',comp:'',compNA:false,emp:'',empNA:false,modality:'',bench:''});
const blankOpp=(id,name,extra={})=>({id,name,country:'',gates:{},ev:{},ans:{},bonus:{},risk:{},num:blankNum(),prep:'',date:'',rec:'',...extra});
let S={opps:[],sel:null,bench:{},adding:true};
function migrate(o){const n={...blankOpp(o.id,o.name),...o};n.num={...blankNum(),...(o.num||{})};n.bonus=o.bonus||{};
  if(!o.bonus){const a=o.ans||{};n.ans={...a};if(a.d2){n.ans.d3=a.d2;delete n.ans.d2}if(a.d3==='yes')n.bonus.k4={on:true};if(a.d4==='yes')n.bonus.k5={on:true};if(!a.d2)delete n.ans.d3;delete n.ans.d4}
  return n}
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&Array.isArray(v.opps))S={...S,...v,adding:!v.opps.length};
  else{const v3=JSON.parse(localStorage.getItem('af-compass-v3')||'null');if(v3&&Array.isArray(v3.opps)){S={...S,opps:v3.opps.map(migrate),sel:v3.sel,bench:v3.bench||{},adding:!v3.opps.length}}}}catch(e){}
S.opps.forEach(o=>{['g1','g2','g3'].forEach(g=>{const v=o.gates&&o.gates[g];if(v&&!['yes','no','open'].includes(v))delete o.gates[g]});if(o.ans){delete o.ans.g2;delete o.ans.g3}});
try{['af-compass-v1','af-compass-v2','af-compass-v3'].forEach(k=>localStorage.removeItem(k))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({opps:S.opps,sel:S.sel,bench:S.bench}))}catch(e){}};
const cur=()=>S.opps.find(o=>o.id===S.sel)||null;

/* ---------- Arithmetic ---------- */
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:null};
const ansPts=(pts,a)=>a==='yes'?pts:a==='partly'?pts/2:a==='no'?0:null;
const bandPts=(k,x)=>{const B=BAND[k];for(const[t,p]of B.b){if(B.dir==='up'?x>=t:x<=t)return p}return 0};
function nextBand(k,x){const B=BAND[k],c=bandPts(k,x);const better=B.b.filter(([t,p])=>p>c);if(!better.length)return null;
  return B.dir==='up'?better.reduce((a,b)=>b[0]<a[0]?b:a):better.reduce((a,b)=>b[0]>a[0]?b:a)}
const benchFor=o=>num(o.num.bench)??num(S.bench[o.num.modality]);
const fmt=n=>n==null?'':Math.round(n).toLocaleString('en-US');
const usd=n=>'$'+fmt(n);
const fp=p=>p==null?'–':(Math.abs(p-Math.round(p))<0.05?String(Math.round(p)):p.toFixed(1));
const lf=s=>s.charAt(0).toLowerCase()+s.slice(1);
const bare=s=>s.replace(/\s*\([^)]*\)/g,'');
const ptsW=n=>`${fp(n)} point${Math.abs(n-1)<0.05?'':'s'}`;
/* Each numeric item returns {pts, na, answered, how, why, up} */
function numItem(o,id){
  const n=o.num,eaa=num(n.eaa),oth=num(n.other),stu=num(n.students),comp=num(n.comp),b=benchFor(o),emp=num(n.emp);
  if(id==='share'){if(eaa==null||oth==null||eaa+oth<=0)return {pts:null,how:'Needs the EAA contribution and funding from others.'};
    const s=oth/(eaa+oth)*100,p=bandPts('share',s),nb=nextBand('share',s);
    return {pts:p,v:s,how:`${usd(oth)} ÷ ${usd(eaa+oth)} = ${s.toFixed(0)}% from partners`,
      why:s>=50?`Partners fund ${s.toFixed(0)}% of the programme (${usd(oth)} of ${usd(eaa+oth)})`:null,
      up:nb&&eaa>0?{gain:nb[1]-p,text:`Raise the partner share from ${s.toFixed(0)}% to ${nb[0]}%: about ${usd(nb[0]*eaa/(100-nb[0])-oth)} more from partners`}:null}}
  if(id==='cost'){const cf=n.compNA?1:(comp!=null?comp/100:null);
    if(eaa==null||!stu||cf==null||!cf||!b)return {pts:null,how:'Needs the EAA contribution, students, completion rate (or N/A) and a benchmark.'};
    const c=eaa/(stu*cf),r=c/b,p=bandPts('cost',r),nb=nextBand('cost',r);
    return {pts:p,v:c,how:`${usd(eaa)} ÷ (${fmt(stu)}${n.compNA?'':` × ${comp}%`}) = ${usd(c)} per ${n.compNA?'student':'graduate'}, ${(r*100).toFixed(0)}% of the ${usd(b)} benchmark`,
      why:r<=1?`Cost per ${n.compNA?'student':'graduate'} of ${usd(c)} is ${(r*100).toFixed(0)}% of the benchmark`:null,
      up:nb?{gain:nb[1]-p,text:`Bring EAA cost per ${n.compNA?'student':'graduate'} from ${usd(c)} to ${usd(nb[0]*b)} or less`}:null}}
  if(id==='stu'){if(stu==null)return {pts:null,how:'Needs the number of students.'};const p=bandPts('stu',stu),nb=nextBand('stu',stu);
    return {pts:p,v:stu,how:`${fmt(stu)} students`,why:stu>=500?`Reaches ${fmt(stu)} students`:null,up:nb?{gain:nb[1]-p,text:`Grow the cohort from ${fmt(stu)} to ${fmt(nb[0])} students`}:null}}
  if(id==='comp'){if(n.compNA)return {na:true,how:'Not applicable: no past cohort.'};if(comp==null)return {pts:null,how:'Needs the partner’s completion rate, or N/A.'};
    const p=bandPts('comp',comp),nb=nextBand('comp',comp);return {pts:p,v:comp,how:`${comp}% in the partner’s last cohort`,why:comp>=80?`Partner’s last cohort completed at ${comp}%`:null,up:nb?{gain:nb[1]-p,text:`Agree a completion target of ${nb[0]}% with retention support`}:null}}
  if(id==='emp'){if(n.empNA)return {na:true,how:'Not applicable: no past cohorts.'};if(emp==null)return {pts:null,how:'Needs the partner’s graduate employment rate, or N/A.'};
    const p=bandPts('emp',emp),nb=nextBand('emp',emp);return {pts:p,v:emp,how:`${emp}% of past graduates employed within 12 months`,why:emp>=60?`${emp}% of the partner’s past graduates found work within 12 months`:null,up:nb?{gain:nb[1]-p,text:`Add a placement component to lift graduate employment from ${emp}% toward ${nb[0]}%`}:null}}
}
function itemResult(o,i){
  if(i.k==='num'){const r=numItem(o,i.id);return {...r,answered:r.na||r.pts!=null}}
  const a=o.ans[i.id];if(a==='na')return {na:true,answered:true};
  const p=ansPts(i.pts,a);return {pts:p,answered:p!=null,a}
}
function compute(o){
  const out={blocks:{},assessed:0,items:{}};
  const t=CONTEXTS.find(c=>c.id===o.country);
  out.blocks.A={pts:t?TIERS[t.tier].pts:0,max:15};if(t)out.assessed+=15;
  let e=0;EVIDENCE.forEach(x=>{const v=o.ev[x.id];if(v&&v.on&&String(v.src||'').trim())e+=x.pts});
  out.blocks.B={pts:Math.min(EV_CAP,e),max:EV_CAP};out.assessed+=EV_CAP;
  BLOCKS.forEach(b=>{let earned=0,app=0;b.items.forEach(i=>{const r=itemResult(o,i);out.items[i.id]=r;if(r.answered)out.assessed+=i.pts;if(r.na)return;app+=i.pts;earned+=r.pts||0});
    const scale=app>0?b.max/app:0;b.items.forEach(i=>out.items[i.id].scale=scale);
    out.blocks[b.id]={pts:app>0?earned*scale:b.max,max:b.max,allNA:app===0}});
  let k=0;BONUS.forEach(x=>{const v=o.bonus[x.id];if(v&&v.on&&(!x.note||String(v.note||'').trim()))k+=x.pts});out.blocks.K={pts:Math.min(BONUS_CAP,k),max:BONUS_CAP};
  let r=0;RISKS.forEach(x=>{if(o.risk[x.id])r+=x.pts});out.blocks.R={pts:-Math.min(RISK_CAP,r),max:RISK_CAP};
  const sum=Object.values(out.blocks).reduce((s,v)=>s+v.pts,0);
  out.total=Math.min(100,Math.max(0,Math.round(sum*2)/2));
  out.complete=Math.min(100,Math.round(out.assessed));
  const g=GATES.map(x=>o.gates[x.id]);out.gateFail=g.includes('no');out.gatePending=g.some(x=>x!=='yes');
  if(out.gateFail)out.total=0;
  out.band=out.gateFail?['Not eligible','p-stop']:out.total>=70?['Pursue','p-pursue']:out.total>=55?['Shape','p-shape']:out.total>=40?['Watch','p-watch']:['Decline','p-decline'];
  out.final=!out.gateFail&&!out.gatePending&&out.complete>=100;
  return out;
}
/* ---------- The rationale, written from the answers ---------- */
function rationale(o,r){
  const t=CONTEXTS.find(c=>c.id===o.country),T=r.total,why=[],todo=[],cond=[];
  // gates
  GATES.forEach(g=>{const v=o.gates[g.id];if(v==='no')cond.push({g:99,text:`Gate failed: ${lf(g.t)}`});else if(v!=='yes')cond.push({g:98,text:`Confirm the gate: ${lf(g.t)}`})});
  // why
  if(t&&t.tier<=2){const grp=GROUPS.find(x=>x.id===t.g);why.push({w:r.blocks.A.pts,text:`${t.name} is a Tier ${t.tier} country (${grp?grp.label.split('· ')[1]:''})`})}
  EVIDENCE.forEach(x=>{const v=o.ev[x.id];if(v&&v.on&&String(v.src||'').trim())why.push({w:x.pts,text:`${x.t}${v.date?` (${v.date})`:''}`})});
  BLOCKS.forEach(b=>b.items.forEach(i=>{const ir=r.items[i.id];if(ir.na)return;
    if(i.k==='check'){if(ir.a==='yes')why.push({w:i.pts*ir.scale,text:`${i.t}: ${lf(bare(i.y))}`});
      const gap=(i.pts-(ir.pts??0))*ir.scale;if(gap>0.05){if(ir.a==='partly'||ir.a==='no')todo.push({g:gap,text:`${i.t}: needs ${lf(bare(i.y))}`});}}
    else{if(ir.why)why.push({w:ir.pts*ir.scale,text:ir.why});if(ir.up&&ir.up.gain>0)todo.push({g:ir.up.gain*ir.scale,text:ir.up.text})}}));
  BONUS.forEach(x=>{const v=o.bonus[x.id];if(v&&v.on&&(!x.note||String(v.note||'').trim()))why.push({w:x.pts,text:`Bonus: ${lf(x.t)}${v.note?`: ${v.note}`:''}`})});
  // evidence gap
  if(r.blocks.B.pts<EV_CAP){const un=EVIDENCE.filter(x=>!(o.ev[x.id]&&o.ev[x.id].on&&String(o.ev[x.id].src||'').trim())).sort((a,b)=>b.pts-a.pts)[0];
    if(un)todo.push({g:Math.min(un.pts,EV_CAP-r.blocks.B.pts),text:`Document a ${lf(un.t)}${un.id==='b1'?' from MOFA, QFFD or the ministry':''}`})}
  RISKS.forEach(x=>{if(o.risk[x.id])todo.push({g:x.pts,text:`Mitigate the risk: ${lf(x.t)}`})});
  // unanswered
  if(!t)todo.push({g:15,text:'Set the beneficiaries’ origin to score the country block'});
  const open=BLOCKS.flatMap(b=>b.items.filter(i=>!r.items[i.id].answered));
  if(open.length)cond.push({g:97,text:`Answer the ${open.length} open line${open.length>1?'s':''}: ${open.slice(0,3).map(i=>lf(i.t)).join(', ')}${open.length>3?'…':''}`});
  why.sort((a,b)=>b.w-a.w);todo.sort((a,b)=>b.g-a.g);
  const gainSum=todo.reduce((s,x)=>s+x.g,0);
  let verdict;
  if(r.gateFail)verdict=`Stop. A gate failed, so this opportunity cannot proceed whatever it scores.`;
  else if(T>=70)verdict=`Pursue. It scores ${fp(T)}%, ${T-70<0.05?'right on':ptsW(T-70)+' above'} the 70% bar for pursuing.${r.final?' All gates pass and every line is assessed.':' Close the open items before signing.'}`;
  else if(T>=55)verdict=`Shape before pitching. It scores ${fp(T)}%, ${ptsW(70-T)} short of Pursue. The changes listed could add up to ${ptsW(Math.min(gainSum,100-T))}.`;
  else if(T>=40)verdict=`Watch. It scores ${fp(T)}%, ${ptsW(55-T)} short of Shape and ${ptsW(70-T)} short of Pursue. Revisit when MOFA, QFFD or a co-funder moves.`;
  else verdict=`Decline or refer. It scores ${fp(T)}%, ${ptsW(40-T)} below Watch. Consider referring it to another EAA programme.`;
  const shapeTitle=r.gateFail?'Why it stops':T>=70?'Conditions before signing':'What to shape';
  const shape=[...cond.sort((a,b)=>b.g-a.g).map(x=>({text:x.text,g:null})),...todo.map(x=>({text:x.text,g:x.g}))];
  return {verdict,why:why.map(x=>x.text),shape,shapeTitle};
}

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BLOCK_NAMES={A:'Country priority',B:'Verified evidence',C:'QFFD fit',D:'Need and labour market',E:'Numbers and co-funding',G:'Employment potential',F:'Delivery',K:'Bonus',R:'Risk'};
const ORDER=['A','B','C','D','E','G','F','K','R'];
const pctOf=b=>b.max?Math.round(b.pts/b.max*100):0;

/* ---------- Rendering ---------- */
function countryOptions(sel){
  return `<option value="">Choose a context</option>`+GROUPS.map(g=>`<optgroup label="${g.label}">${CONTEXTS.filter(c=>c.g===g.id).map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${esc(c.name)} · ${TIERS[c.tier].pts} pts</option>`).join('')}</optgroup>`).join('');
}
function renderList(){
  const el=document.getElementById('opplist');
  if(!S.opps.length){el.innerHTML='<div class="empty">No opportunities yet.</div>';return}
  el.innerHTML=S.opps.map(o=>{const r=compute(o);
    return `<button type="button" class="opp" data-sel="${o.id}" aria-current="${o.id===S.sel&&!S.adding}"><span class="nm">${esc(o.name||'Untitled')}</span><span class="sc">${r.gateFail?'✕':fp(r.total)+'%'}</span></button>`}).join('');
}

   </form></div>`;

function seg(name,cur,opts){return `<div class="seg" role="radiogroup">${opts.map(([v,l])=>`<input type="radio" name="${name}" id="${name}-${v}" value="${v}" ${cur===v?'checked':''}><label for="${name}-${v}">${l}</label>`).join('')}</div>`}
function checkItem(o,i){return `<fieldset class="q"><legend>${i.t}</legend><p class="def"><b>Yes:</b> ${i.y}. <b>Partly:</b> ${i.p}.${i.n?` <b>No:</b> ${i.n}.`:''}</p>
  <div class="ctl">${seg(`${o.id}-${i.id}`,o.ans[i.id],[['yes','Yes'],['partly','Partly'],['no','No'],['na','N/A']])}<span class="pts" id="pt-${i.id}"></span></div></fieldset>`}
function numLine(id,title){return `<div class="calc"><span>${title}</span><span class="how" id="how-${id}"></span><span class="pts" id="pt-${id}"></span></div>`}
function renderSheet(){
  if(S.adding||!cur()){S.adding=true;renderList();renderNew();return}
  const o=cur(),id=o.id,n=o.num,h=[];
  h.push(`<div class="scorebar" id="scorebar"></div>`);
  h.push(`<div class="card rat" id="rat"></div>`);
  h.push(`<div class="card"><div class="grid2">
    <label class="f">Opportunity name<input type="text" id="${id}-name" data-f="name" value="${esc(o.name)}"></label>

  label('Evidence and ties',cols[2],sy);sy+=3.8;
  const evs=EVIDENCE.filter(x=>{const v=o.ev[x.id];return v&&v.on&&String(v.src||'').trim()}).map(x=>({p:x.pts,t:x.t,s:(o.ev[x.id].date?o.ev[x.id].date+' · ':'')+o.ev[x.id].src}));
  BONUS.filter(x=>{const v=o.bonus[x.id];return v&&v.on&&(!x.note||String(v.note||'').trim())}).forEach(x=>evs.push({p:x.pts,t:x.t,s:o.bonus[x.id].note||x.d,bonus:true}));
  if(!evs.length){font(7.3);tc(INK);txt('None recorded',cols[2],sy);sy+=3.9}
  evs.slice(0,4).forEach(e=>{font(7.1,'bold');tc(e.bonus?GOOD:INK);txt(wrap(`+${e.p}  ${e.t}`,colW,1),cols[2],sy);sy+=3.2;font(6.5);tc(MUT);txt(wrap(e.s,colW,1),cols[2],sy);sy+=3.7});
  y=Math.max(fy,ly,sy)+2.5;
  // checklist
  dc(LINE);doc.setLineWidth(0.3);doc.line(L,y,R,y);y+=4.5;label('Checklist answers',L,y);
  font(6.3);tc(MUT);txt('Filled: Yes   Half: Partly   Ring: No   N/A: not applicable   Dash: open',R,y,{align:'right'});y+=4.2;
  const items=BLOCKS.flatMap(b=>b.items.filter(i=>i.k==='check').map(i=>({...i,b:b.id})));const rows=Math.ceil(items.length/2),half2=(CW-8)/2;
  items.forEach((i,k)=>{const col=k<rows?0:1,row=k%rows,x=L+col*(half2+8),yy=y+row*3.8;const a=o.ans[i.id];
    dc(INK);doc.setLineWidth(0.3);
    if(a==='yes'){fc(INK);doc.circle(x+1.2,yy-1.1,1.2,'F')}
    else if(a==='partly'){doc.circle(x+1.2,yy-1.1,1.2,'S');fc(INK);doc.rect(x,yy-2.3,1.2,2.4,'F')}
    else if(a==='no'){doc.circle(x+1.2,yy-1.1,1.2,'S')}
    else if(a==='na'){font(5.5,'bold');tc(MUT);txt('N/A',x-0.4,yy-0.3)}
    else{dc(MUT);doc.line(x+0.2,yy-1.1,x+2.2,yy-1.1)}
    font(7.3);tc(INK);txt(wrap(`${i.b} · ${i.t}`,half2-20,1),x+5,yy);
    const ir=r.items[i.id];font(7.3,'bold');tc(ir.pts==null||ir.na?MUT:INK);txt(ir.na?'N/A':`${ir.pts==null?'–':fp(ir.pts)} / ${i.pts}`,x+half2,yy,{align:'right'})});
  y+=rows*3.8;
  // footer, always clear of the content
  const fy2=Math.max(y+5,287);
  dc(LINE);doc.setLineWidth(0.3);doc.line(L,fy2-4,R,fy2-4);
  font(6.3);tc(MUT);txt(`Opportunity Compass · ${RULES_VERSION}`,L,fy2);txt('Score = country + evidence + QFFD fit + need + numbers + employment + delivery + bonus - risk, capped at 100',L,fy2+3.2);
  txt('Page 1 of 1',R,fy2,{align:'right'});
  return doc;
}

/* ---------- Method and country views ---------- */
function renderMethod(){
  const rows=[];
  const sub=(l,m)=>rows.push(`<tr class="sub"><td colspan="2">${l}</td><td class="n">${m}</td></tr>`);
  const row=(a,b,c)=>rows.push(`<tr><td>${a}</td><td>${b}</td><td class="n">${c}</td></tr>`);
  sub('A · Country priority','15');Object.entries(TIERS).forEach(([k,v])=>row(`Tier ${k}`,v.rule,v.pts));
  sub('B · Verified evidence (capped)','10');EVIDENCE.forEach(x=>row(x.t,x.d+'. Counts once a source is named; the date is optional.','+'+x.pts));
  BLOCKS.forEach(b=>{sub(`${b.id} · ${b.name}`,b.max);b.items.forEach(i=>row(i.t,i.k==='num'?BAND[i.id].txt:`Yes: ${i.y}. Partly: ${i.p}. N/A removes the line.`,i.pts))});
  sub('Bonus (capped, on top)','+10');BONUS.forEach(x=>row(x.t,x.d+(x.note?'. Needs a note.':'.'),'+'+x.pts));
  sub('R · Risk deductions (capped)','−15');RISKS.forEach(x=>row(x.t,x.d,'−'+x.pts));
  document.getElementById('v-method').innerHTML=`
  <div class="card"><h2>How the score works</h2>
   <p class="lead">Every point comes from a rule written below. The scorer answers facts; the rulebook turns them into points. Nobody types a score. Because the blocks add up to 100, every point is one percentage point of the score.</p>
   <div class="formula">Score % = A country 15 + B evidence 10 + C QFFD fit 15 + D need 15 + E numbers 25 + G employment 10 + F delivery 10 + bonus (up to 10) − risk (up to 15), capped at 100</div>
   <ol class="steps">
    <li>Check the three gates. Any No stops the opportunity.</li>
    <li>Pick the beneficiaries’ origin. The country guide sets the points. A country on more than one list takes the higher tier.</li>
    <li>Tick each evidence signal and name its source. The date is optional.</li>
    <li>Answer each line Yes, Partly, No or N/A against its written definition. Yes earns the full points, Partly half, No none. N/A takes the line out, and the block rescales over the lines that apply, so a line that does not fit never costs points.</li>
    <li>Enter the figures. Fixed bands convert them to points. The partner share carries the most weight, and its points climb fastest past 50%.</li>
    <li>Tick bonuses with a note, and the risks that are true today.</li>
    <li>Read the verdict: 70% or more, pursue; 55% to 69%, shape; 40% to 54%, watch; below 40%, decline or refer. The page writes the reasons and the changes that would add points, each with its value.</li>
    <li>Export the one-page PDF for finance, legal and management.</li>
   </ol>
   <p class="note">To reduce bias, have two people score the same opportunity separately, then compare their scorecards line by line. A disagreement points to a definition that needs tightening.</p>
  </div>
  <div class="card"><h2>What each verdict means</h2>
   <p class="lead">The bands are fixed. To reach 70%, an opportunity has to earn about 7 of every 10 points available after risk. No single block can carry it alone: country and evidence together are worth only 25 points.</p>
   <div class="tablewrap" style="border:0"><table><thead><tr><th style="width:18%">Verdict</th><th style="width:12%">Score</th><th>What it means</th><th style="width:30%">What happens next</th></tr></thead><tbody>
    <tr><td><span class="pill p-pursue">Pursue</span></td><td>70% or more</td><td>Strong on Qatar alignment, need and value, with manageable risk. The case stands on verified facts. The verdict is final only when all three gates pass and the whole score is assessed.</td><td>Write the concept note and the QFFD pitch. Close the listed conditions before signing.</td></tr>
    <tr><td><span class="pill p-shape">Shape</span></td><td>55% to 69%</td><td>Worth doing, with specific gaps. The page lists each change and the points it would add, such as a higher partner share, a signed ministry letter or a documented request.</td><td>Work on the listed changes, rescore, and pitch once it clears 70%.</td></tr>
    <tr><td><span class="pill p-watch">Watch</span></td><td>40% to 54%</td><td>Not ready. Alignment, need or value is too thin today.</td><td>Keep it on the watch list. Rescore when MOFA, QFFD or a co-funder moves, or every quarter.</td></tr>
    <tr><td><span class="pill p-decline">Decline</span></td><td>Below 40%</td><td>Does not fit Al Fakhoora’s priorities or Qatar’s current map.</td><td>Decline, or refer it to another EAA programme.</td></tr>
    <tr><td><span class="pill p-stop">Not eligible</span></td><td>Any gate is No</td><td>Outside the mandate, failed due diligence, or blocked by a legal or sanctions barrier.</td><td>Stop, whatever the score.</td></tr>
   </tbody></table></div></div>
  <div class="tablewrap"><table><thead><tr><th style="width:26%">Criterion</th><th>Rule</th><th style="width:70px;text-align:right">Points</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>
  <div class="card"><h2>Cost benchmarks by modality</h2>
   <p class="lead">Median EAA cost per completing graduate from your finance workbook. Each opportunity compares against the median for its modality.</p>
   <div class="grid2">${MODALITIES.map((m,i)=>`<label class="f">${m} (USD)<input type="number" min="0" id="bench-${i}" data-bench="${esc(m)}" value="${esc(S.bench[m]??'')}"></label>`).join('')}</div>
   <p class="note">These stay in this browser. An opportunity can override its benchmark on its own sheet.</p></div>`;
  document.querySelectorAll('[data-bench]').forEach(el=>el.addEventListener('input',e=>{const v=e.target.value;if(v==='')delete S.bench[e.target.dataset.bench];else S.bench[e.target.dataset.bench]=v;save()}));
}
function renderCountries(){
  document.getElementById('v-countries').innerHTML=`
  <div class="card"><h2>Country priority guide</h2>
   <p class="lead">Tiers combine three public signals up to 1 November 2026: MOFA’s statements, QatarEnergy’s investments (from its Annual Review 2024 and announcements since), and QFFD’s priority geographies. MOFA’s most recent list came from the Global Security Forum in October 2026: Afghanistan, Gaza, Sudan, Lebanon, Somalia and Syria. QatarEnergy countries enter at Tier 2. A country on more than one list takes the higher tier.</p></div>
  ${GROUPS.map(g=>`<div class="tablewrap"><table><thead><tr><th style="width:24%">${g.label}</th><th style="width:70px;text-align:right">Points</th><th>Basis</th></tr></thead><tbody>
   ${CONTEXTS.filter(c=>c.g===g.id).map(c=>`<tr><td>${esc(c.name)}</td><td class="n">${TIERS[c.tier].pts}</td><td>${c.qe&&c.g!=='qe'&&c.g!=='qe2'?'<span class="tag qe">Also QatarEnergy</span>':''}${esc(c.basis)} ${c.src?`<a href="${c.src}" target="_blank" rel="noopener">Source</a>`:''}${c.src2?` · <a href="${c.src2}" target="_blank" rel="noopener">Second source</a>`:''}</td></tr>`).join('')}
  </tbody></table></div>`).join('')}
  <p class="note">QatarEnergy countries come from its Annual Review 2024 and from announcements up to 1 November 2026. Countries it entered between 2019 and 2021 but that its latest review does not show are marked to confirm. LNG buyers with no QatarEnergy investment (such as India, Bangladesh, Kuwait and Taiwan) are left out. A strong signal from one country between reviews belongs in block B as evidence, not in a tier change.</p>`;
}

/* ---------- Events ---------- */
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
document.getElementById('opplist').addEventListener('click',e=>{const b=e.target.closest('[data-sel]');if(b){S.sel=b.dataset.sel;S.adding=false;save();renderSheet()}});
const sheet=document.getElementById('sheet');
function onInput(e){const el=e.target,o=cur();if(!o||S.adding||!el.id)return;
  if(el.dataset.f){o[el.dataset.f]=el.value;refresh();return}
  if(el.dataset.ev){const v=o.ev[el.dataset.ev]||(o.ev[el.dataset.ev]={on:false,date:'',src:''});v[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;refresh();return}
  if(el.dataset.bonus){const v=o.bonus[el.dataset.bonus]||(o.bonus[el.dataset.bonus]={on:false,note:''});v[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;refresh();return}
  if(el.dataset.risk){o.risk[el.dataset.risk]=el.checked;refresh();return}
  if(el.dataset.n){o.num[el.dataset.n]=el.type==='checkbox'?el.checked:el.value;refresh();return}
  if(el.type==='radio'){const key=el.name.slice(o.id.length+1);if(key.startsWith('gate-'))o.gates[key.slice(5)]=el.value;else o.ans[key]=el.value;refresh()}
}
sheet.addEventListener('input',onInput);sheet.addEventListener('change',onInput);
sheet.addEventListener('submit',e=>{if(e.target.id!=='newform')return;e.preventDefault();
  const name=document.getElementById('new-name').value.trim();if(!name){document.getElementById('new-name').focus();return}
  const id='u'+Date.now(),nm=blankNum();nm.modality=document.getElementById('new-mod').value;
  S.opps.push(blankOpp(id,name,{country:document.getElementById('new-country').value,date:new Date().toISOString().slice(0,10),num:nm}));
  S.sel=id;S.adding=false;save();renderSheet();window.scrollTo({top:0})});
let downloads=null;
(async()=>{try{downloads=await window.claude?.use?.('downloads')}catch(e){downloads=null}})();
sheet.addEventListener('click',async e=>{
  if(e.target.id==='cancelnew'){S.adding=false;renderSheet();return}
  if(e.target.id==='copy'){const txt=scorecard();try{await navigator.clipboard.writeText(txt);toast('Scorecard copied')}catch(err){toast('Copy is blocked in this view')}}
  if(e.target.id==='pdf'){const btn=e.target,note=document.getElementById('pdfnote'),o=cur();
    if(!window.jspdf){note.textContent='The PDF library did not load. Check your internet connection and reload the page.';return}
    btn.disabled=true;btn.textContent='Preparing PDF…';note.textContent='';
    const fname=`${(o.name||'Opportunity').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')}-justification.pdf`;
    let doc;
    try{doc=buildPDF(o)}catch(err){note.textContent='The PDF could not be built.';btn.disabled=false;btn.textContent='Export one-page PDF';return}
    try{
      if(downloads){await downloads.save({filename:fname,data:doc.output('blob')});toast('PDF saved')}
      else{doc.save(fname);toast('PDF downloaded')}
    }catch(err){const c=err&&err.code;
      if(c==='declined')note.textContent='Export cancelled.';
      else if(c==='rate_limited')note.textContent='A save prompt is already open.';
      else{try{doc.save(fname);toast('PDF downloaded')}catch(e2){note.textContent='The PDF could not be saved here.'}}}
    finally{btn.disabled=false;btn.textContent='Export one-page PDF'}}
  if(e.target.id==='del'){const btn=e.target;if(btn.dataset.armed){S.opps=S.opps.filter(x=>x.id!==S.sel);S.sel=S.opps[0]?.id||null;S.adding=!S.opps.length;save();renderSheet()}else{btn.dataset.armed='1';btn.textContent='Click again to remove';setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent='Remove this opportunity'}},3000)}}
});
document.getElementById('add').addEventListener('click',()=>{S.adding=true;location.hash='score';renderSheet()});
function route(){const v=['score','method','countries'].includes(location.hash.slice(1))?location.hash.slice(1):'score';
  ['score','method','countries'].forEach(k=>{document.getElementById('v-'+k).hidden=k!==v;document.querySelector(`[data-view="${k}"]`).setAttribute('aria-current',k===v?'page':'false')});
  if(v==='method')renderMethod();if(v==='countries')renderCountries();if(v==='score')renderSheet();}
window.addEventListener('hashchange',route);
renderList();route();

</script>
