<title>Opportunity Compass</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,650;8..144,800&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: a scoring sheet. Opportunity list on the left, the checklist in the middle, a sticky score ledger on top. Light only, by request. */
:root{
  color-scheme:light;
  --bg:#f5f6f8; --surface:#ffffff; --ink:#16181d; --muted:#5a606c; --line:#e0e3e9; --soft:#f0f2f5;
  --red:#D32737; --red-ink:#a81d2b; --red-tint:#fbe9eb;
  --good:#1b7046; --good-tint:#e3f2ea; --warn:#8f5600; --warn-tint:#fbf0dc; --crit:#b42318; --crit-tint:#fdeceb; --grey-tint:#eceef2;
  --f-ui:"Roboto Flex",Roboto,Arial,sans-serif; --f-num:"Roboto Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
h1{font-weight:800;font-size:clamp(26px,5vw,36px);letter-spacing:-.02em;margin:0;line-height:1.1}
h1 span{color:var(--red)}
.asof{font-size:13px;color:var(--muted)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--red)}
nav a:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.view{display:grid;gap:20px}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}.opps{max-height:280px;overflow:auto}}
.opps{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;gap:2px;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
@media (max-width:860px){.opps{position:static}}
.opp{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.opp:hover{background:var(--soft)}
.opp[aria-current="true"]{background:var(--red-tint)}
.opp:focus-visible{outline:2px solid var(--red)}
.opp .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opp .sc{font-family:var(--f-num);font-size:13px;font-variant-numeric:tabular-nums}
.opps .empty{padding:10px;font-size:13px;color:var(--muted)}
.opps .tools{display:flex;gap:6px;padding:8px 4px 4px;border-top:1px solid var(--line);margin-top:4px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.sheet{display:grid;gap:16px;min-width:0}
.scorebar{position:sticky;top:max(12px,env(safe-area-inset-top,0px));z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;box-shadow:0 6px 18px -12px rgba(22,24,29,.25)}
.big{font-family:var(--f-num);font-size:44px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:16px;color:var(--muted)}
.meta{display:grid;gap:8px;min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:12px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.p-pursue{background:var(--good-tint);color:var(--good)} .p-shape{background:var(--warn-tint);color:var(--warn)} .p-watch{background:var(--grey-tint);color:var(--muted)} .p-decline,.p-stop{background:var(--crit-tint);color:var(--crit)} .p-prov{background:var(--soft);color:var(--muted)}
.blocks{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media (max-width:620px){.blocks{grid-template-columns:repeat(4,minmax(0,1fr))}}
.blk{font-size:11px;color:var(--muted);display:grid;gap:3px}
.blk b{font-family:var(--f-num);font-weight:500;font-size:13px;color:var(--ink)}
.blk i{display:block;height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.blk i span{display:block;height:100%;background:var(--red)}
.blk.neg i span{background:var(--crit)}
.complete{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px}
.card h2{margin:0;font-size:17px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.card h2 .of{font-family:var(--f-num);font-weight:500;font-size:14px;color:var(--muted);white-space:nowrap}
.card h2 .of b{color:var(--ink);font-weight:500}
.card.export{border-color:var(--ink)}
.lead{margin:0;color:var(--muted);font-size:14px;max-width:72ch}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid #cdd2da;border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.q{border:0;border-top:1px solid var(--line);padding:12px 0 0;margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:start}
.q:first-of-type{border-top:0;padding-top:0}
.q legend{float:left;width:100%;padding:0;font-weight:500;font-size:14px}
.q .def{grid-column:1;margin:0;font-size:13px;color:var(--muted)}
.q .ctl{grid-column:2;grid-row:1 / span 2;display:flex;gap:8px;align-items:center}
@media (max-width:620px){.q{grid-template-columns:minmax(0,1fr)}.q .ctl{grid-column:1;grid-row:auto}}
.seg{display:inline-flex;border:1px solid #cdd2da;border-radius:8px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:6px 11px;font-size:13px;cursor:pointer;border-left:1px solid #cdd2da;white-space:nowrap;color:var(--muted)}
.seg label:first-of-type{border-left:0}
.seg input:checked+label{background:var(--ink);color:#fff}
.seg input:focus-visible+label{outline:2px solid var(--red);outline-offset:-2px}
.pts{font-family:var(--f-num);font-size:13px;min-width:5.5ch;text-align:right;font-variant-numeric:tabular-nums}
.pts.none{color:#9aa0ab}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:start;border-top:1px solid var(--line);padding-top:12px}
.ev:first-of-type{border-top:0;padding-top:0}
.ev input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--red)}
.ev .txt{display:grid;gap:2px;font-size:14px}
.ev .txt small{color:var(--muted);font-size:13px}
.ev .src{grid-column:2 / span 2;display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px}
@media (max-width:620px){.ev .src{grid-template-columns:minmax(0,1fr)}}
.warn{font-size:12px;color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.calc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;border-top:1px solid var(--line);padding-top:12px;font-size:14px}
.calc .how{color:var(--muted);font-size:13px;grid-column:1}
.calc .pts{grid-column:2;grid-row:1 / span 2}
.tierbox{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14px;display:grid;gap:4px}
.tierbox b{font-weight:650}
.tierbox a{color:var(--red-ink)}
.note{font-size:13px;color:var(--muted);margin:0;max-width:75ch}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--soft)}
td.n{font-family:var(--f-num);text-align:right;white-space:nowrap}
tr.sub td{background:#fafbfc;font-weight:650}
td a{color:var(--red-ink)}
.tag{display:inline-block;font-size:11px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);margin-right:6px}
.tag.qe{background:#e6eef8;color:#1d4f86}
.formula{font-family:var(--f-num);font-size:13px;background:var(--soft);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:nowrap}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;max-width:78ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;z-index:20}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:grid;gap:14px}
.welcome h2{margin:0;font-size:22px;letter-spacing:-.01em}
.newform{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:end}
@media (prefers-reduced-motion:no-preference){.blk i span{transition:width .25s}}
</style>

const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:null};
const ansPts=(pts,a)=>a==='yes'?pts:a==='partly'?pts/2:a==='no'?0:null;

function benchFor(o){return num(o.num.bench)??num(S.bench[o.num.modality])}
function numbers(o){
  const n=o.num,eaa=num(n.eaa),oth=num(n.other),stu=num(n.students),comp=num(n.comp),b=benchFor(o);
  const r={};
  if(eaa!=null&&stu&&comp&&b){const c=eaa/(stu*comp/100);r.cost={pts:bandDown(c/b,BAND_COST),c,ratio:c/b,b}}else r.cost={pts:null,b};
  if(eaa!=null&&oth!=null){const l=eaa===0?Infinity:oth/eaa;r.lev={pts:eaa===0?(oth>0?10:0):(l>0?Math.max(bandUp(l,BAND_LEV),2):0),l}}else r.lev={pts:null};
  r.stu=stu!=null?{pts:bandUp(stu,BAND_STU),v:stu}:{pts:null};
  r.comp=comp!=null?{pts:bandUp(comp,BAND_COMP),v:comp}:{pts:null};
  return r;
}
function compute(o){
  const out={blocks:{},assessed:0};
  const t=CONTEXTS.find(c=>c.id===o.country);
  out.blocks.A={pts:t?TIERS[t.tier].pts:0,max:20};if(t)out.assessed+=20;
  let e=0;EVIDENCE.forEach(x=>{const v=o.ev[x.id];if(v&&v.on&&String(v.src||'').trim())e+=x.pts});
  out.blocks.B={pts:Math.min(EV_CAP,e),max:EV_CAP};out.assessed+=EV_CAP;
  BLOCKS.forEach(b=>{let p=0;b.items.forEach(i=>{const v=ansPts(i.pts,o.ans[i.id]);if(v!=null){p+=v;out.assessed+=i.pts}});out.blocks[b.id]={pts:p,max:b.max}});
  const n=numbers(o);let ep=0;[['cost',10],['lev',10],['stu',6],['comp',4]].forEach(([k,m])=>{if(n[k].pts!=null){ep+=n[k].pts;out.assessed+=m}});
  out.blocks.E={pts:ep,max:30};out.num=n;
  let r=0;RISKS.forEach(x=>{if(o.risk[x.id])r+=x.pts});out.blocks.R={pts:-Math.min(RISK_CAP,r),max:RISK_CAP};
  const sum=Object.values(out.blocks).reduce((s,v)=>s+v.pts,0);
  out.total=Math.max(0,Math.round(sum*2)/2);
  out.complete=Math.round(out.assessed);
  const g=GATES.map(x=>o.gates[x.id]);out.gateFail=g.includes('no');out.gatePending=g.some(x=>x!=='yes');
  if(out.gateFail)out.total=0;

  return out;
}

function autoSummary(o,r){

function strengthsAndWatch(o,r){
  const s=[],w=[];const pct=k=>r.blocks[k].max?r.blocks[k].pts/r.blocks[k].max:0;
  ['A','B','C','D','E','F'].forEach(k=>{const p=pct(k);if(p>=0.75)s.push(`${BLOCK_NAMES[k]}: ${fp(r.blocks[k].pts)} of ${r.blocks[k].max}`);else if(p<0.5)w.push(`${BLOCK_NAMES[k]}: ${fp(r.blocks[k].pts)} of ${r.blocks[k].max}`)});

function buildPDF(o){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  const r=compute(o),t=CONTEXTS.find(c=>c.id===o.country),n=r.num;
  const RED=[211,39,55],INK=[22,24,29],MUT=[96,102,114],LINE=[224,227,233],SOFT=[245,246,248],TINT=[251,233,235],QE=[29,79,134];
  const BANDC={'Pursue':[[227,242,234],[27,112,70]],'Shape':[[251,240,220],[143,86,0]],'Watch':[[236,238,242],[90,96,108]],'Decline':[[253,236,235],[180,35,24]],'Not eligible':[[253,236,235],[180,35,24]]};
  const W=210,L=16,R=W-14,CW=R-L;
  const tc=c=>doc.setTextColor(...c),fc=c=>doc.setFillColor(...c),dc=c=>doc.setDrawColor(...c);
  const font=(sz,st='normal')=>{doc.setFont('helvetica',st);doc.setFontSize(sz)};
  const txt=(s,x,y,o={})=>doc.text(Array.isArray(s)?s.map(pdfText):pdfText(s),x,y,o);
  const wrap=(s,w,max)=>{let ls=doc.splitTextToSize(pdfText(s),w);if(max&&ls.length>max){ls=ls.slice(0,max);ls[max-1]=ls[max-1].replace(/\s*\S*$/,'')+'…'}return ls};
  const label=(s,x,y,c=MUT,al)=>{font(6.5,'bold');tc(c);doc.setCharSpace(0.35);const u=pdfText(s.toUpperCase());txt(u,al==='right'?x-doc.getTextWidth(u)-0.35*(u.length-1):x,y);doc.setCharSpace(0)};
  // edge and header
  fc(RED);doc.rect(0,0,5,297,'F');
  label('Al Fakhoora · Education Above All',L,15,RED);
  label('Opportunity justification',R,15,MUT,'right');
  font(7.5);tc(MUT);txt(o.date?new Date(o.date+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'',R,19.5,{align:'right'});
  font(19,'bold');tc(INK);const tl=wrap(o.name||'Untitled opportunity',CW-40,2);txt(tl,L,25);
  let y=25+tl.length*7.2+0.5;
  font(8.5);tc(MUT);
  const sub=[t?`${t.name} · Tier ${t.tier}${t.qe?' · QatarEnergy country':''}`:'Country not set',o.num.modality||'',o.prep?`Prepared by ${o.prep}`:''].filter(Boolean).join('   |   ');
  txt(sub,L,y);y+=5;
  dc(LINE);doc.setLineWidth(0.3);doc.line(L,y,R,y);y+=6;
  // hero: ring + recommendation
  const cx=L+19,cy=y+19,rad=15.5;
  dc(LINE);doc.setLineWidth(2.6);doc.circle(cx,cy,rad,'S');
  const frac=Math.max(0,Math.min(1,r.total/100));
  if(frac>0){dc(r.gateFail?[180,35,24]:RED);doc.setLineCap('round');const steps=Math.max(2,Math.round(90*frac));let px=cx,py=cy-rad;for(let i=1;i<=steps;i++){const a=-Math.PI/2+2*Math.PI*frac*i/steps,nx=cx+rad*Math.cos(a),ny=cy+rad*Math.sin(a);doc.line(px,py,nx,ny);px=nx;py=ny}doc.setLineCap('butt')}
  font(20,'bold');tc(INK);txt(fp(r.total),cx,cy+2.2,{align:'center'});
  font(6.5);tc(MUT);txt('OUT OF 100',cx,cy+6.6,{align:'center'});
  const bc=BANDC[r.band[0]];font(7.5,'bold');const bw=doc.getTextWidth(r.band[0].toUpperCase())+8;
  fc(bc[0]);doc.roundedRect(cx-bw/2,cy+rad+4,bw,6,3,3,'F');tc(bc[1]);doc.setCharSpace(0.3);txt(r.band[0].toUpperCase(),cx,cy+rad+8.2,{align:'center'});doc.setCharSpace(0);
  font(6.5);tc(MUT);txt(r.final?'Final assessment':`Provisional · ${r.complete}% assessed`,cx,cy+rad+14,{align:'center'});
  // recommendation panel
  const rx=L+44,rw=R-rx,ry=y-1,rh=46;
  fc(TINT);doc.roundedRect(rx,ry,rw,rh,2.5,2.5,'F');fc(RED);doc.rect(rx,ry+3,1.2,rh-6,'F');
  label(o.rec&&o.rec.trim()?'Recommendation':'Summary from the scores',rx+6,ry+7,RED);
  font(9.5);tc(INK);const recText=(o.rec&&o.rec.trim())?o.rec.trim():autoSummary(o,r);
  const rl=wrap(recText||' ',rw-12,8);doc.setLineHeightFactor(1.35);txt(rl,rx+6,ry+13);doc.setLineHeightFactor(1.15);
  y=ry+rh+10;
  // strengths and watch points
  const sw=strengthsAndWatch(o,r),half=(CW-8)/2;
  const bullets=(title,items,x,c,empty)=>{label(title,x,y,c);font(8.5);tc(INK);let yy=y+5;(items.length?items:[empty]).forEach(s=>{fc(c);doc.circle(x+1,yy-1.1,0.7,'F');tc(items.length?INK:MUT);const ls=wrap(s,half-6,1);txt(ls,x+4,yy);yy+=4.6});return yy};
  const y1=bullets('Why proceed',sw.s,L,[27,112,70],'No block scores 75% or more yet');
  const y2=bullets('Watch points',sw.w,L+half+8,[143,86,0],'None flagged');
  y=Math.max(y1,y2)+3;
  // score build-up
  label('Score build-up',L,y);y+=4;
  const rows=['A','B','C','D','E','F','R'];const lw=34,vw=16,bx=L+lw,bwid=CW-lw-vw;
  rows.forEach(k=>{const b=r.blocks[k];font(8);tc(INK);txt(BLOCK_NAMES[k],L,y+2.6);
    fc(SOFT);doc.roundedRect(bx,y,bwid,3.2,1.6,1.6,'F');
    const f=b.max?Math.abs(b.pts)/b.max:0;if(f>0){fc(k==='R'?[180,35,24]:k==='A'&&t&&t.qe&&t.g==='qe'?QE:RED);doc.roundedRect(bx,y,Math.max(3.2,bwid*f),3.2,1.6,1.6,'F')}
    font(8,'bold');tc(k==='R'&&b.pts<0?[180,35,24]:INK);txt(k==='R'?`${fp(b.pts)}`:`${fp(b.pts)} / ${b.max}`,R,y+2.6,{align:'right'});y+=5.4});
  y+=3;
  // three department columns
  const colW=(CW-10)/3,cols=[L,L+colW+5,L+2*(colW+5)],top=y;
  const colHead=(i,title)=>{fc(INK);doc.rect(cols[i],top,colW,0.8,'F');label(title,cols[i],top+5,INK)};
  const kv=(i,yy,k,v,bold)=>{font(7.5);tc(MUT);txt(k,cols[i],yy);font(7.5,bold?'bold':'normal');tc(INK);txt(v,cols[i]+colW,yy,{align:'right'});return yy+4.3};
  colHead(0,'Finance');let fy=top+10;
  const eaa=num(o.num.eaa),oth=num(o.num.other);
  fy=kv(0,fy,'EAA contribution',eaa!=null?`$${fmt(eaa)}`:'–');
  fy=kv(0,fy,'Funding from others',oth!=null?`$${fmt(oth)}`:'–');
  fy=kv(0,fy,'Programme total',eaa!=null&&oth!=null?`$${fmt(eaa+oth)}`:'–',true);
  fy=kv(0,fy,'Leverage',n.lev.pts!=null?(isFinite(n.lev.l)?`${n.lev.l.toFixed(2)} : 1`:'EAA manages only'):'–');
  fy=kv(0,fy,'Students',n.stu.pts!=null?fmt(n.stu.v):'–');
  fy=kv(0,fy,'Expected completion',n.comp.pts!=null?`${n.comp.v}%`:'–');
  fy=kv(0,fy,'Cost per graduate',n.cost.pts!=null?`$${fmt(n.cost.c)}`:'–',true);
  fy=kv(0,fy,'Benchmark',n.cost.b?`$${fmt(n.cost.b)}`:'–');
  fy=kv(0,fy,'Numbers score',`${fp(r.blocks.E.pts)} / 30`,true);
  colHead(1,'Legal and compliance');let ly=top+10;
  GATES.forEach(g=>{const v=o.gates[g.id];const c=v==='yes'?[27,112,70]:v==='no'?[180,35,24]:[143,86,0];fc(c);doc.circle(cols[1]+1.2,ly-1.1,1,'F');font(7.5);tc(INK);const ls=wrap(g.t,colW-14,2);txt(ls,cols[1]+4,ly);font(7,'bold');tc(c);txt(v==='yes'?'Pass':v==='no'?'Fail':'Open',cols[1]+colW,ly,{align:'right'});ly+=ls.length*3.4+1.6});
  ly+=1.5;font(7,'bold');tc(MUT);txt('RISKS FLAGGED',cols[1],ly);ly+=4;
  const fl=RISKS.filter(x=>o.risk[x.id]);
  if(!fl.length){font(7.5);tc(INK);txt('None flagged',cols[1],ly);ly+=4.3}
  fl.slice(0,4).forEach(x=>{font(7.5);tc(INK);const ls=wrap(x.t,colW-10,2);txt(ls,cols[1],ly);font(7.5,'bold');tc([180,35,24]);txt(`-${x.pts}`,cols[1]+colW,ly,{align:'right'});ly+=ls.length*3.4+1.2});
  ly=kv(1,ly+1,'Risk deduction',`${fp(r.blocks.R.pts)}`,true);
  colHead(2,'Strategy and management');let sy=top+10;
  if(t){font(8,'bold');tc(INK);txt(`${t.name}: Tier ${t.tier}, ${TIERS[t.tier].pts} pts`,cols[2],sy);sy+=4;font(7);tc(MUT);const bl=wrap(t.basis,colW,4);txt(bl,cols[2],sy);sy+=bl.length*3.1+2}
  else{font(7.5);tc(MUT);txt('Country not set',cols[2],sy);sy+=5}
  font(7,'bold');tc(MUT);txt('VERIFIED EVIDENCE',cols[2],sy);sy+=4;
  const evs=EVIDENCE.filter(x=>{const v=o.ev[x.id];return v&&v.on&&String(v.src||'').trim()});
  if(!evs.length){font(7.5);tc(INK);txt('None recorded',cols[2],sy);sy+=4.3}
  evs.slice(0,3).forEach(x=>{const v=o.ev[x.id];font(7.5,'bold');tc(INK);txt(`+${x.pts}  ${x.t}`,cols[2],sy);sy+=3.4;font(6.8);tc(MUT);const ls=wrap(v.date?`${v.date} · ${v.src}`:v.src,colW,1);txt(ls,cols[2],sy);sy+=4});
  sy=kv(2,sy+0.5,'QFFD fit',`${fp(r.blocks.C.pts)} / 15`,true);
  y=Math.max(fy,ly,sy)+3;
  // checklist grid
  dc(LINE);doc.setLineWidth(0.3);doc.line(L,y,R,y);y+=5;label('Checklist answers',L,y);
  font(6.5);tc(MUT);txt('Filled: Yes   Half: Partly   Ring: No   Dash: unanswered',R,y,{align:'right'});y+=4.5;
  const items=BLOCKS.flatMap(b=>b.items.map(i=>({...i,b:b.id})));const half2=(CW-8)/2;
  items.forEach((i,k)=>{const col=k<6?0:1,row=k%6,x=L+col*(half2+8),yy=y+row*4.6;const a=o.ans[i.id];
    dc(INK);doc.setLineWidth(0.3);
    if(a==='yes'){fc(INK);doc.circle(x+1.3,yy-1.1,1.3,'F')}
    else if(a==='partly'){doc.circle(x+1.3,yy-1.1,1.3,'S');fc(INK);doc.rect(x,yy-2.4,1.3,2.6,'F')}
    else if(a==='no'){doc.circle(x+1.3,yy-1.1,1.3,'S')}
    else{dc(MUT);doc.line(x+0.3,yy-1.1,x+2.3,yy-1.1)}
    font(7.5);tc(INK);txt(wrap(`${i.b} · ${i.t}`,half2-22,1),x+5,yy);
    const p=ansPts(i.pts,a);font(7.5,'bold');tc(p==null?MUT:INK);txt(`${p==null?'–':fp(p)} / ${i.pts}`,x+half2,yy,{align:'right'})});
  y+=6*4.6+2;
  // sign-off
  const so=Math.max(y+2,262);const sw4=(CW-12)/4;
  ['Programme','Finance','Legal','Management'].forEach((s,i)=>{const x=L+i*(sw4+4);fc(SOFT);doc.roundedRect(x,so,sw4,18,2,2,'F');label(s,x+3,so+5);dc([190,195,204]);doc.setLineWidth(0.25);doc.line(x+3,so+13,x+sw4-3,so+13);font(6);tc(MUT);txt('Name, signature, date',x+3,so+16.2)});
  // footer
  font(6.5);tc(MUT);txt(`Scored with Opportunity Compass · ${RULES_VERSION} · Score = country + evidence + QFFD fit + need + numbers + delivery - risk`,L,289);
  txt('1 / 1',R,289,{align:'right'});
  return doc;
}

/* ---------- Method and country views ---------- */
function renderMethod(){
  const rows=[];
  const sub=(l,m)=>rows.push(`<tr class="sub"><td colspan="2">${l}</td><td class="n">${m}</td></tr>`);
  const row=(a,b,c)=>rows.push(`<tr><td>${a}</td><td>${b}</td><td class="n">${c}</td></tr>`);
  sub('A · Country priority','20');Object.entries(TIERS).forEach(([k,v])=>row(`Tier ${k}`,v.rule,v.pts));
  sub('B · Verified evidence (capped)','10');EVIDENCE.forEach(x=>row(x.t,x.d+'. Counts once a source is named; the date is optional.','+'+x.pts));
  BLOCKS.slice(0,2).forEach(b=>{sub(`${b.id} · ${b.name}`,b.max);b.items.forEach(i=>row(i.t,`Yes: ${i.y}. Partly: ${i.p}.`,i.pts))});
  sub('E · The numbers','30');
  row('Cost per completing graduate','EAA contribution ÷ (students × completion rate), compared with the benchmark. At or below 50% of benchmark: 10 · 75%: 8 · 100%: 6 · 125%: 4 · 150%: 2 · above 150%: 0','10');
  row('Co-funding leverage','Funding from others ÷ EAA contribution. 3 or more: 10 · 2: 8 · 1: 6 · 0.5: 4 · above 0: 2 · none: 0. EAA manages with no own funds: 10','10');
  row('Students reached','2,000 or more: 6 · 1,000: 5 · 500: 4 · 250: 3 · 100: 2 · 25: 1 · fewer: 0','6');
  row('Expected completion','Partner’s last cohort. 90% or more: 4 · 80%: 3 · 70%: 2 · 60%: 1 · lower: 0','4');
  const F=BLOCKS[2];sub(`${F.id} · ${F.name}`,F.max);F.items.forEach(i=>row(i.t,`Yes: ${i.y}. Partly: ${i.p}.`,i.pts));
  sub('R · Risk deductions (capped)','−15');RISKS.forEach(x=>row(x.t,x.d,'−'+x.pts));
  document.getElementById('v-method').innerHTML=`
  <div class="card"><h2>How the score works</h2>
   <p class="lead">Every point comes from a rule written below. The scorer answers facts; the rulebook turns them into points. Nobody types a score directly.</p>
   <div class="formula">Score = A country + B evidence + C QFFD fit + D need + E numbers + F delivery − R risk &nbsp;·&nbsp; maximum 100, minimum 0</div>
   <ol class="steps">
    <li>Check the three gates. Any No stops the opportunity.</li>
    <li>Pick the beneficiaries’ origin. The country guide sets the points. A country on more than one list takes the higher tier.</li>
    <li>Tick each evidence signal and name its source. The date is optional. No source, no points.</li>
    <li>Answer each checklist line Yes, Partly or No against its written definition. Yes earns the full points, Partly half, No none.</li>
    <li>Enter the figures. Fixed bands convert them to points.</li>
    <li>Tick the risks that are true today.</li>
    <li>Read the result: 70 or more, pursue; 55 to 69, shape the weakest block first; 40 to 54, watch; below 40, decline or refer. The result stays provisional until all 100 points are assessed and the gates are checked.</li>
    <li>Export the one-page PDF for finance, legal and management sign-off.</li>
   </ol>
   <p class="note">To reduce bias, have two people score the same opportunity separately, then compare their scorecards line by line. A disagreement points to a definition that needs tightening.</p>
  </div>
  <div class="tablewrap"><table><thead><tr><th style="width:26%">Criterion</th><th>Rule</th><th style="width:70px;text-align:right">Points</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>
  <div class="card"><h2>Cost benchmarks by modality</h2>
   <p class="lead">Median EAA cost per completing graduate from your finance workbook. Each opportunity compares against the median for its modality, so a master’s abroad is never judged against a TVET diploma.</p>
   <div class="grid2">${MODALITIES.map((m,i)=>`<label class="f">${m} (USD)<input type="number" min="0" id="bench-${i}" data-bench="${esc(m)}" value="${esc(S.bench[m]??'')}"></label>`).join('')}</div>
   <p class="note">These stay in this browser. An opportunity can override its benchmark on its own sheet.</p></div>`;
  document.querySelectorAll('[data-bench]').forEach(el=>el.addEventListener('input',e=>{const v=e.target.value;if(v==='')delete S.bench[e.target.dataset.bench];else S.bench[e.target.dataset.bench]=v;save()}));
}
function renderCountries(){
  document.getElementById('v-countries').innerHTML=`
  <div class="card"><h2>Country priority guide</h2>
   <p class="lead">Tiers combine three public signals up to 1 November 2026: MOFA’s statements, QatarEnergy’s investments (from its Annual Review 2024 and announcements since), and QFFD’s priority geographies. MOFA’s most recent list came from the Global Security Forum in October 2026: Afghanistan, Gaza, Sudan, Lebanon, Somalia and Syria. QatarEnergy countries enter at Tier 2. A country on more than one list takes the higher tier.</p></div>
  ${GROUPS.map(g=>`<div class="tablewrap"><table><thead><tr><th style="width:24%">${g.label}</th><th style="width:70px;text-align:right">Points</th><th>Basis</th></tr></thead><tbody>
   ${CONTEXTS.filter(c=>c.g===g.id).map(c=>`<tr><td>${esc(c.name)}</td><td class="n">${TIERS[c.tier].pts}</td><td>${c.qe&&c.g!=='qe'?'<span class="tag qe">Also QatarEnergy</span>':''}${esc(c.basis)} ${c.src?`<a href="${c.src}" target="_blank" rel="noopener">Source</a>`:''}${c.src2?` · <a href="${c.src2}" target="_blank" rel="noopener">QatarEnergy source</a>`:''}</td></tr>`).join('')}
  </tbody></table></div>`).join('')}
  <p class="note">QatarEnergy countries come from its Annual Review 2024 and from announcements up to 1 November 2026. Countries it entered between 2019 and 2021 but that its latest review does not show are marked to confirm. LNG buyers with no QatarEnergy investment (such as India, Bangladesh, Kuwait and Taiwan) are left out. A strong signal from one country between reviews belongs in block B as evidence (a written request is worth 5 points), not in a tier change.</p>`;
}

/* ---------- Events ---------- */
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
document.getElementById('opplist').addEventListener('click',e=>{const b=e.target.closest('[data-sel]');if(b){S.sel=b.dataset.sel;S.adding=false;save();renderSheet()}});
const sheet=document.getElementById('sheet');
function onInput(e){const el=e.target,o=cur();if(!o||S.adding||!el.id)return;
  if(el.dataset.f){o[el.dataset.f]=el.value;refresh();return}
  if(el.dataset.ev){const v=o.ev[el.dataset.ev]||(o.ev[el.dataset.ev]={on:false,date:'',src:''});v[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;refresh();return}
  if(el.dataset.risk){o.risk[el.dataset.risk]=el.checked;refresh();return}
  if(el.dataset.n){o.num[el.dataset.n]=el.value;refresh();return}
  if(el.type==='radio'){const key=el.name.slice(o.id.length+1);if(GATES.some(g=>g.id===key))o.gates[key]=el.value;else o.ans[key]=el.value;refresh()}
}
sheet.addEventListener('input',onInput);sheet.addEventListener('change',onInput);
sheet.addEventListener('submit',e=>{if(e.target.id!=='newform')return;e.preventDefault();
  const name=document.getElementById('new-name').value.trim();if(!name){document.getElementById('new-name').focus();return}
  const id='u'+Date.now();S.opps.push(blankOpp(id,name,{country:document.getElementById('new-country').value,date:new Date().toISOString().slice(0,10),num:{eaa:'',other:'',students:'',comp:'',modality:document.getElementById('new-mod').value,bench:''}}));
  S.sel=id;S.adding=false;save();renderSheet();window.scrollTo({top:0})});
let downloads=null;
(async()=>{try{downloads=await window.claude?.use?.('downloads')}catch(e){downloads=null}})();
sheet.addEventListener('click',async e=>{
  if(e.target.id==='cancelnew'){S.adding=false;renderSheet();return}
  if(e.target.id==='copy'){const txt=scorecard();try{await navigator.clipboard.writeText(txt);toast('Scorecard copied')}catch(err){toast('Copy is blocked in this view')}}
  if(e.target.id==='pdf'){const btn=e.target,note=document.getElementById('pdfnote'),o=cur();
    if(!window.jspdf){note.textContent='The PDF library did not load. Check your connection and reload the page.';return}
    btn.disabled=true;btn.textContent='Preparing PDF…';note.textContent='';
    const fname=`${(o.name||'Opportunity').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')}-justification.pdf`;
    let doc;
    try{doc=buildPDF(o)}catch(err){note.textContent='The PDF could not be built.';btn.disabled=false;btn.textContent='Export one-page PDF';return}
    try{
      if(downloads){await downloads.save({filename:fname,data:doc.output('blob')});toast('PDF saved')}
      else{doc.save(fname);toast('PDF downloaded')}
    }catch(err){const c=err&&err.code;
      if(c==='declined')note.textContent='Export cancelled.';
      else if(c==='rate_limited')note.textContent='A save prompt is already open.';
      else{try{doc.save(fname);toast('PDF downloaded')}catch(e2){note.textContent='The PDF could not be saved here.'}}}
    finally{btn.disabled=false;btn.textContent='Export one-page PDF'}}
  if(e.target.id==='del'){const btn=e.target;if(btn.dataset.armed){S.opps=S.opps.filter(x=>x.id!==S.sel);S.sel=S.opps[0]?.id||null;S.adding=!S.opps.length;save();renderSheet()}else{btn.dataset.armed='1';btn.textContent='Click again to remove';setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent='Remove this opportunity'}},3000)}}
});
document.getElementById('add').addEventListener('click',()=>{S.adding=true;location.hash='score';renderSheet()});
function route(){const v=['score','method','countries'].includes(location.hash.slice(1))?location.hash.slice(1):'score';
  ['score','method','countries'].forEach(k=>{document.getElementById('v-'+k).hidden=k!==v;document.querySelector(`[data-view="${k}"]`).setAttribute('aria-current',k===v?'page':'false')});
  if(v==='method')renderMethod();if(v==='countries')renderCountries();if(v==='score')renderSheet();}
window.addEventListener('hashchange',route);
renderList();route();
</script>
